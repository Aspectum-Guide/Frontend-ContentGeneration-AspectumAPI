components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - en
        - ru
        - it
        - fr
        - de
        - es
        default: en
      description: Язык ответа. Влияет на локализованные поля (name, title, description).
        По умолчанию — en.
  schemas:
    AccountAccessSummary:
      type: object
      properties:
        active_city_subscriptions_count:
          type: integer
          readOnly: true
        active_city_ids:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
      required:
      - active_city_ids
      - active_city_subscriptions_count
    AccountFavoriteListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserFavoriteWithTarget'
      required:
      - results
    AccountFavoriteMutationResponse:
      type: object
      properties:
        favorite:
          $ref: '#/components/schemas/UserFavorite'
        created:
          type: boolean
      required:
      - created
      - favorite
    AccountFavoritesSummary:
      type: object
      properties:
        total_count:
          type: integer
          readOnly: true
        by_type:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
      required:
      - by_type
      - total_count
    AccountFavoritesSyncResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserFavorite'
        synced_count:
          type: integer
        created_count:
          type: integer
        skipped:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - created_count
      - results
      - skipped
      - synced_count
    AccountProfile:
      type: object
      properties:
        id:
