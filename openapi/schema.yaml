openapi: 3.0.3
info:
  title: Aspectum API
  version: 0.0.5
  description: 'Public API for Aspectum touring app: cities, events, bookings, subscriptions,
    AI content generation.'
paths:
  /api/v1/account/favorites:
    get:
      operationId: api_v1_account_favorites_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountFavoriteListResponse'
          description: ''
    post:
      operationId: api_v1_account_favorites_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFavoriteWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserFavoriteWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserFavoriteWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountFavoriteMutationResponse'
          description: ''
  /api/v1/account/favorites/{target_type}/{target_id}:
    delete:
      operationId: api_v1_account_favorites_destroy
      parameters:
      - in: path
        name: target_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: target_type
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/account/favorites/sync:
    post:
      operationId: api_v1_account_favorites_sync_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFavoritesSyncRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserFavoritesSyncRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserFavoritesSyncRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountFavoritesSyncResponse'
          description: ''
  /api/v1/account/me:
    get:
      operationId: api_v1_account_me_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
          description: ''
  /api/v1/account/summary:
    get:
      operationId: api_v1_account_summary_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
          description: ''
  /api/v1/admin/calculate-nearest-events:
    get:
      operationId: api_v1_admin_calculate_nearest_events_retrieve
      description: |-
        Рассчитывает ближайшие события для всех событий в указанном городе.
        Если city_id не указан, рассчитывает для всех событий.
        Доступно только для staff-пользователей.

        Используется в Django admin шаблонах для массового расчета ближайших событий.
        Остальной функционал админки доступен через Django admin (EventsAPI/admin.py).
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNearestEventsResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNearestEventsForbidden'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNearestEventsError'
          description: ''
  /api/v1/admin/calculate-nearest-events/{city_id}:
    get:
      operationId: api_v1_admin_calculate_nearest_events_retrieve_2
      description: |-
        Рассчитывает ближайшие события для всех событий в указанном городе.
        Если city_id не указан, рассчитывает для всех событий.
        Доступно только для staff-пользователей.

        Используется в Django admin шаблонах для массового расчета ближайших событий.
        Остальной функционал админки доступен через Django admin (EventsAPI/admin.py).
      parameters:
      - in: path
        name: city_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNearestEventsResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNearestEventsForbidden'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateNearestEventsError'
          description: ''
  /api/v1/admin/import-from-sheets/:
    post:
      operationId: api_v1_admin_import_from_sheets_create
      description: |-
        Импорт данных из Google Sheets в БД. Staff only.
        POST JSON: {"dry_run": false, "spreadsheet_id": "..."}
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportFromSheetsRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportFromSheetsRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportFromSheetsRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFromSheetsBadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFromSheetsForbidden'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFromSheetsError'
          description: ''
  /api/v1/admin/run-command/:
    post:
      operationId: api_v1_admin_run_command_create
      description: |-
        Выполняет management-команду из whitelist. Staff only.
        POST JSON: {"command": "cleanup_expired_sessions", "args": [], "kwargs": {"dry_run": true}}
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunManagementCommandRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunManagementCommandRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunManagementCommandRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunManagementCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunManagementCommandBadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunManagementCommandForbidden'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunManagementCommandError'
          description: ''
  /api/v1/analytics/events/:
    post:
      operationId: api_v1_analytics_events_create
      description: |-
        POST /api/v1/analytics/events/ — batch event ingestion.

        AllowAny overrides the project-wide default IsAuthenticated for this one
        view only (REST_FRAMEWORK.DEFAULT_PERMISSION_CLASSES stays untouched):
        most product events fire before login (onboarding, browsing), so this
        endpoint must accept anonymous traffic. Same per-view override pattern
        as EventsAPI.views.EventAudioStreamView.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsIngestRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalyticsIngestRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalyticsIngestRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsIngestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsIngestErrorResponse'
          description: ''
  /api/v1/analytics/summary/:
    get:
      operationId: api_v1_analytics_summary_retrieve
      description: |-
        GET /api/v1/analytics/summary/

        Staff-only product analytics aggregates. Prefer DailyEventRollup when the
        requested window is fully covered; otherwise fall back to live RawEvent
        aggregation so a fresh deploy still answers before the first beat rollup.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: event_name
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: platform
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
          description: ''
  /api/v1/assistant/chat/cancel/:
    post:
      operationId: api_v1_assistant_chat_cancel_create
      description: |-
        Single-conversation-per-user chat API on top of
        ai_assistant.services.entrypoint.process_assistant_message.

        Uses default DRF auth/permissions (JWTAuthentication + IsAuthenticated) —
        no anonymous access.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAssistantRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelAssistantRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelAssistantRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/assistant/chat/feedback/:
    post:
      operationId: api_v1_assistant_chat_feedback_create
      description: POST feedback for an assistant message owned by the authenticated
        user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantFeedbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantFeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantFeedbackRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantFeedbackResponse'
          description: ''
  /api/v1/assistant/chat/history/:
    get:
      operationId: api_v1_assistant_chat_history_list
      description: |-
        Single-conversation-per-user chat API on top of
        ai_assistant.services.entrypoint.process_assistant_message.

        Uses default DRF auth/permissions (JWTAuthentication + IsAuthenticated) —
        no anonymous access.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationMessage'
          description: ''
  /api/v1/assistant/chat/messages/{message_id}/:
    delete:
      operationId: api_v1_assistant_chat_messages_destroy
      description: |-
        Single-message delete, scoped to the requesting user's own conversation.
        Uses default DRF auth/permissions (JWTAuthentication + IsAuthenticated),
        same as AssistantChatViewSet.
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/chat/progress/:
    get:
      operationId: api_v1_assistant_chat_progress_retrieve
      description: Фаза текущей генерации для живых статусов («Подбираю места…»).
      parameters:
      - in: query
        name: request_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatProgressResponse'
          description: ''
  /api/v1/assistant/chat/reset/:
    post:
      operationId: api_v1_assistant_chat_reset_create
      description: |-
        Single-conversation-per-user chat API on top of
        ai_assistant.services.entrypoint.process_assistant_message.

        Uses default DRF auth/permissions (JWTAuthentication + IsAuthenticated) —
        no anonymous access.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/chat/send/:
    post:
      operationId: api_v1_assistant_chat_send_create
      description: |-
        Single-conversation-per-user chat API on top of
        ai_assistant.services.entrypoint.process_assistant_message.

        Uses default DRF auth/permissions (JWTAuthentication + IsAuthenticated) —
        no anonymous access.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessage'
          description: ''
  /api/v1/assistant/health/:
    get:
      operationId: api_v1_assistant_health_retrieve
      description: 'Liveness: process is alive. Does not check DB/Redis/providers.'
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantLivenessResponse'
          description: ''
  /api/v1/assistant/ready/:
    get:
      operationId: api_v1_assistant_ready_retrieve
      description: 'Readiness: PostgreSQL + Redis must be reachable. Providers excluded.'
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantReadinessResponse'
          description: ''
  /api/v1/assistant/route/day/:
    post:
      operationId: api_v1_assistant_route_day_create
      description: |-
        POST /assistant/route/day/ {message_id, day} — построитель маршрута дня.

        Берёт route_points из metadata_json.itinerary_days СВОЕГО сообщения
        (фильтр по conversation пользователя) и возвращает план маршрута
        (services.route_builder.build_day_route). 404 — нет сообщения, нет дня
        или у дня нет точек с координатами. Auth — дефолтные JWT + IsAuthenticated.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayRouteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayRouteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayRouteRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/assistant/route/plan/:
    post:
      operationId: api_v1_assistant_route_plan_create
      description: |-
        POST /assistant/route/plan/ — маршрут по городу, категориям и пожеланию.

        В отличие от route/day/ ручка ничего не знает о диалоге: ни сообщения, ни
        дня, ни истории. Это сделано ради карты в приложении, где маршрут просят
        кнопкой, а не разговором, и где пользователь может быть не залогинен —
        поэтому доступ анонимный, но с отдельным лимитом.

        Ответ — тот же контракт, что у route/day/ (stops/legs/totals/geometry),
        плюс applied с разобранными ограничениями, summary от модели и source:
        llm — места выбрала модель, nearest — отбор по близости.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePlanRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoutePlanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoutePlanRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/2fa/confirm:
    post:
      operationId: api_v1_auth_2fa_confirm_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorConfirmResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDetailResponse'
          description: ''
  /api/v1/auth/2fa/disable:
    post:
      operationId: api_v1_auth_2fa_disable_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDisableResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDetailResponse'
          description: ''
  /api/v1/auth/2fa/setup:
    post:
      operationId: api_v1_auth_2fa_setup_create
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDetailResponse'
          description: ''
  /api/v1/auth/2fa/status:
    get:
      operationId: api_v1_auth_2fa_status_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatusResponse'
          description: ''
  /api/v1/auth/2fa/verify:
    post:
      operationId: api_v1_auth_2fa_verify_create
      description: Проверить код и выдать НОВУЮ пару токенов с otp_verified=True.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorVerifyResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDetailResponse'
          description: ''
  /api/v1/auth/apple:
    post:
      operationId: api_v1_auth_apple_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppleAuthRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppleAuthRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthRequest'
          description: ''
  /api/v1/auth/favorites:
    get:
      operationId: api_v1_auth_favorites_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesListResponse'
          description: ''
    post:
      operationId: api_v1_auth_favorites_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFavoriteWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserFavoriteWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserFavoriteWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesCreateResponse'
          description: ''
  /api/v1/auth/favorites/{target_type}/{target_id}:
    delete:
      operationId: api_v1_auth_favorites_destroy
      parameters:
      - in: path
        name: target_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: target_type
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/favorites/sync:
    post:
      operationId: api_v1_auth_favorites_sync_create
      tags:
      - api
      requestBody:
        content:
