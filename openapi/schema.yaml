      description: |-
        Отмена активного hold без создания брони.
        Возвращает места обратно в available_seats, если soft-lock ещё не был снят.
        Если на hold успели создать PaymentIntent, который ещё не завершился —
        отменяем его в Stripe, чтобы не висели «orphan»-PI в дашборде.
