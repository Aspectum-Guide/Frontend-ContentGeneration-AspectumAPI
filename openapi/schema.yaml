  /api/v1/booking/reservations/payment-status/:
    get:
      operationId: api_v1_booking_reservations_payment_status_retrieve
      description: |-
        Cheap, freely-retryable payment status poll for a hold — this is the
        ONLY place allowed to make a live provider API call (TBank GetState).
        `create-payment-intent` and `finalize-from-hold` never do: both only
        trust locally recorded state (webhook, or a previous call to this
        endpoint), so a slow/unreachable provider can never block a
        money-critical request. Clients poll this after checkout instead.
      parameters:
      - in: query
        name: hold_token
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
          description: ''
