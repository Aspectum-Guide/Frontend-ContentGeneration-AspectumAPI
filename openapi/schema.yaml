      description: |-
        Создаёт (или переиспользует) Stripe PaymentIntent для hold.

        Идемпотентность:
        Создаёт (или переиспользует) платёж для hold через активного провайдера.
        Идемпотентность и race-condition handling делегированы в PaymentsAPI provider.
      tags:
      - api
