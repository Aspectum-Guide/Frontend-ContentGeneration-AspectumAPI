  /api/v1/booking/reservations/finalize-from-hold/:
    post:
      operationId: api_v1_booking_reservations_finalize_from_hold_create
      description: |-
        Финализация резерва используя hold token.

        Два этапа чтобы Stripe-вызов не блокировал DB-строки:
          Phase 1 — read-only preflight: проверяем hold, считаем сумму, верифицируем оплату.
          Phase 2 — atomic commit: берём локи, проверяем ещё раз, списываем места, создаём резерв.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingReservationFinalizeFromHoldRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingReservationFinalizeFromHoldRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingReservationFinalizeFromHoldRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingReservationWithHoldResponse'
          description: ''
  /api/v1/booking/reservations/guest-finalize/:
    post:
      operationId: api_v1_booking_reservations_guest_finalize_create
      description: |-
        Гостевая финализация резерва (без аккаунта):
        - требует email
        - атомарно уменьшает available_seats
        - создаёт BookingReservation с guest_email и user=NULL
        - только бесплатные слоты (total_price == 0); платные — через finalize-from-hold
      tags:
